[project]
name = "wattson"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lalith-Dev", email = "lalithepythoneer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
wattson = "wattson:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
